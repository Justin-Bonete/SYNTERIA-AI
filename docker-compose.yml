services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syntra_dev_password}
      POSTGRES_DB: syntra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://syntra:${DB_PASSWORD:-syntra_dev_password}@db:5432/syntra
      FRONTEND_DIR: /frontend
    volumes:
      - ./frontend:/frontend:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
